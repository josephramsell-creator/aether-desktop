name: Windows desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run typecheck
      - run: npm.cmd test
      - run: npm.cmd run desktop:ui
      - run: npx.cmd electron-builder --win dir --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Aether-Windows-x64-${{ github.sha }}
          path: release/win-unpacked/
          if-no-files-found: error
          retention-days: 14
